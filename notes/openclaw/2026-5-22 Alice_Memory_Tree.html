<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alice 记忆框架 — 2026-05-22</title>
<style>
:root {
  --bg-deep: #080c12;
  --bg-panel: #0d141e;
  --bg-card: #111922;
  --border-subtle: #1a2533;
  --border-glow: #1e3048;
  --text-primary: #c8d6e5;
  --text-secondary: #7a8c9e;
  --text-dim: #4a5568;
  --cyan: #39c5e6;
  --cyan-dim: #1a4a5e;
  --amber: #f0a040;
  --amber-dim: #4a3020;
  --rose: #e0558a;
  --rose-dim: #4a2038;
  --teal: #3cb8a0;
  --teal-dim: #1a403a;
  --violet: #8b7cf0;
  --violet-dim: #2a2050;
  --green: #5cb85c;
  --green-dim: #1a3a1a;
  --font-mono: "JetBrains Mono", "Cascadia Code", "Fira Code", "Consolas", monospace;
  --font-sans: "Segoe UI", system-ui, -apple-system, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg-deep);
  color: var(--text-primary);
  font-family: var(--font-sans);
  line-height: 1.6;
  min-height: 100vh;
  background-image:
    radial-gradient(ellipse at 50% 0%, rgba(57,197,230,0.04) 0%, transparent 60%),
    radial-gradient(ellipse at 85% 100%, rgba(224,85,138,0.03) 0%, transparent 50%),
    radial-gradient(ellipse at 15% 80%, rgba(60,184,160,0.03) 0%, transparent 50%);
}

.dot-grid {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: radial-gradient(rgba(57,197,230,0.06) 1px, transparent 1px);
  background-size: 24px 24px;
}

.container { max-width: 1280px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 1; }

/* Header */
.header {
  padding: 48px 0 32px;
  text-align: center;
  border-bottom: 1px solid var(--border-subtle);
  margin-bottom: 48px;
}
.header h1 {
  font-family: var(--font-mono);
  font-size: 2rem;
  font-weight: 300;
  color: var(--cyan);
  letter-spacing: 0.02em;
  margin-bottom: 8px;
}
.header .subtitle {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: var(--text-dim);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.header .badge {
  display: inline-block;
  margin-top: 12px;
  padding: 4px 14px;
  border: 1px solid var(--border-glow);
  border-radius: 3px;
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--text-secondary);
  letter-spacing: 0.06em;
  background: rgba(57,197,230,0.04);
}

/* Section titles */
.section-title {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.12em;
  margin-bottom: 24px;
  padding-left: 12px;
  border-left: 2px solid var(--cyan);
}

/* Architecture Diagram */
.arch-diagram {
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  grid-template-rows: auto auto auto;
  gap: 20px;
  margin-bottom: 56px;
}

.arch-zone {
  background: var(--bg-panel);
  border: 1px solid var(--border-subtle);
  border-radius: 6px;
  padding: 20px;
  position: relative;
  transition: border-color 0.3s, box-shadow 0.3s;
}
.arch-zone:hover {
  border-color: var(--border-glow);
  box-shadow: 0 0 30px rgba(57,197,230,0.04);
}
.arch-zone.zone-sources { grid-column: 1; grid-row: 1; border-top: 2px solid var(--teal); }
.arch-zone.zone-pipeline { grid-column: 2; grid-row: 1 / 3; border-top: 2px solid var(--cyan); }
.arch-zone.zone-vaults { grid-column: 3; grid-row: 1; border-top: 2px solid var(--amber); }
.arch-zone.zone-librarian { grid-column: 1; grid-row: 2; border-top: 2px solid var(--violet); }
.arch-zone.zone-memory { grid-column: 3; grid-row: 2; border-top: 2px solid var(--rose); }
.arch-zone.zone-active { grid-column: 1; grid-row: 3; border-top: 2px solid var(--green); }
.arch-zone.zone-consumers { grid-column: 2 / 4; grid-row: 3; border-top: 2px solid var(--text-dim); }

.zone-label {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--text-dim);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 14px;
}

.zone-nodes { display: flex; flex-wrap: wrap; gap: 8px; }

.node {
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: 4px;
  padding: 10px 14px;
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.25s;
  position: relative;
  flex: 1 1 auto;
  min-width: 100px;
}
.node:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
}
.node .node-name {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--text-primary);
  line-height: 1.3;
}
.node .node-detail {
  font-size: 0.65rem;
  color: var(--text-secondary);
  margin-top: 2px;
  line-height: 1.3;
}

/* Node color variants */
.node-sources { border-left: 2px solid var(--teal); }
.node-sources:hover { border-color: var(--teal); box-shadow: 0 0 20px rgba(60,184,160,0.1); }
.node-pipeline { border-left: 2px solid var(--cyan); }
.node-pipeline:hover { border-color: var(--cyan); box-shadow: 0 0 20px rgba(57,197,230,0.1); }
.node-vaults { border-left: 2px solid var(--amber); }
.node-vaults:hover { border-color: var(--amber); box-shadow: 0 0 20px rgba(240,160,64,0.1); }
.node-librarian { border-left: 2px solid var(--violet); }
.node-librarian:hover { border-color: var(--violet); box-shadow: 0 0 20px rgba(139,124,240,0.1); }
.node-memory { border-left: 2px solid var(--rose); }
.node-memory:hover { border-color: var(--rose); box-shadow: 0 0 20px rgba(224,85,138,0.1); }
.node-active { border-left: 2px solid var(--green); }
.node-active:hover { border-color: var(--green); box-shadow: 0 0 20px rgba(92,184,92,0.1); }
.node-consumers { border-left: 2px solid var(--text-dim); }
.node-consumers:hover { border-color: var(--text-secondary); box-shadow: 0 0 20px rgba(122,140,158,0.1); }

/* Flow arrows */
.flow-section {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 16px 0;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.flow-arrow {
  display: flex;
  align-items: center;
  gap: 0;
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--text-dim);
}
.flow-arrow .arrow-line {
  width: 32px;
  height: 1px;
  background: var(--border-glow);
  position: relative;
}
.flow-arrow .arrow-line::after {
  content: '';
  position: absolute;
  right: -1px;
  top: -3px;
  border: 4px solid transparent;
  border-left: 6px solid var(--border-glow);
}
.flow-label {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  color: var(--text-dim);
  letter-spacing: 0.05em;
  padding: 2px 8px;
  border: 1px dashed var(--border-subtle);
  border-radius: 3px;
}

/* Memory Levels */
.levels-row {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
  margin-bottom: 56px;
}
.level-card {
  background: var(--bg-panel);
  border: 1px solid var(--border-subtle);
  border-radius: 6px;
  padding: 20px 16px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s;
  position: relative;
  overflow: hidden;
}
.level-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  transition: height 0.3s;
}
.level-card:hover { transform: translateY(-3px); }
.level-card:hover::before { height: 4px; }
.level-l1::before { background: var(--teal); }
.level-l2::before { background: var(--cyan); }
.level-l3::before { background: var(--amber); }
.level-l4::before { background: var(--violet); }
.level-l5::before { background: var(--rose); }
.level-card .level-badge {
  font-family: var(--font-mono);
  font-size: 0.6rem;
  color: var(--text-dim);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.level-card .level-name {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  margin: 8px 0;
  color: var(--text-primary);
}
.level-card .level-desc {
  font-size: 0.7rem;
  color: var(--text-secondary);
  line-height: 1.4;
}
.level-arrow {
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-dim);
  font-size: 0.7rem;
}
/* Arrow rows between levels */
.levels-arrows {
  display: grid;
  grid-template-columns: 1fr 24px 1fr 24px 1fr 24px 1fr 24px 1fr;
  align-items: center;
  margin: -8px 0 16px;
  padding: 0 40px;
}
.levels-arrows span {
  text-align: center;
  font-size: 0.6rem;
  color: var(--text-dim);
  white-space: nowrap;
}

/* Sequence Diagram */
.seq-diagram {
  background: var(--bg-panel);
  border: 1px solid var(--border-subtle);
  border-radius: 6px;
  padding: 28px;
  margin-bottom: 56px;
  overflow-x: auto;
}
.seq-header {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
  margin-bottom: 20px;
}
.seq-participant {
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--cyan);
  text-align: center;
  padding: 8px 4px;
  border-bottom: 2px solid var(--cyan-dim);
}
.seq-step {
  display: grid;
  grid-template-columns: 40px 1fr 24px 1fr;
  gap: 8px;
  align-items: center;
  padding: 6px 0;
  font-size: 0.72rem;
  color: var(--text-secondary);
  animation: seqFadeIn 0.5s ease backwards;
}
.seq-step:nth-child(1) { animation-delay: 0.1s; }
.seq-step:nth-child(2) { animation-delay: 0.2s; }
.seq-step:nth-child(3) { animation-delay: 0.3s; }
.seq-step:nth-child(4) { animation-delay: 0.4s; }
.seq-step:nth-child(5) { animation-delay: 0.5s; }
.seq-step:nth-child(6) { animation-delay: 0.6s; }
.seq-step:nth-child(7) { animation-delay: 0.7s; }
.seq-step:nth-child(8) { animation-delay: 0.8s; }
.seq-step:nth-child(9) { animation-delay: 0.9s; }
.seq-step:nth-child(10) { animation-delay: 1.0s; }
.seq-step:nth-child(11) { animation-delay: 1.1s; }
.seq-step:nth-child(12) { animation-delay: 1.2s; }

@keyframes seqFadeIn {
  from { opacity: 0; transform: translateX(-10px); }
  to { opacity: 1; transform: translateX(0); }
}
.seq-step .seq-time {
  font-family: var(--font-mono);
  font-size: 0.55rem;
  color: var(--text-dim);
  text-align: right;
}
.seq-step .seq-from {
  text-align: right;
  font-family: var(--font-mono);
  font-size: 0.62rem;
  color: var(--amber);
}
.seq-step .seq-arrow {
  text-align: center;
  color: var(--text-dim);
  font-size: 0.6rem;
}
.seq-step .seq-to {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  color: var(--teal);
}
.seq-note {
  grid-column: 1 / -1;
  font-size: 0.6rem;
  color: var(--text-dim);
  font-style: italic;
  padding: 4px 0 4px 44px;
}
.seq-divider {
  grid-column: 1 / -1;
  border-top: 1px dashed var(--border-subtle);
  margin: 8px 0;
}

/* Parameter Table */
.params-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 12px;
  margin-bottom: 56px;
}
.param-group {
  background: var(--bg-panel);
  border: 1px solid var(--border-subtle);
  border-radius: 6px;
  overflow: hidden;
}
.param-group-header {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  font-weight: 500;
  color: var(--cyan);
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-subtle);
  background: rgba(57,197,230,0.03);
  letter-spacing: 0.04em;
}
.param-group.memory .param-group-header { color: var(--rose); background: rgba(224,85,138,0.03); }
.param-group.active .param-group-header { color: var(--green); background: rgba(92,184,92,0.03); }
.param-group.librarian .param-group-header { color: var(--violet); background: rgba(139,124,240,0.03); }
.param-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding: 10px 16px;
  font-size: 0.73rem;
  border-bottom: 1px solid rgba(26,37,51,0.5);
}
.param-row:last-child { border-bottom: none; }
.param-key { color: var(--text-secondary); }
.param-val {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  color: var(--text-primary);
  text-align: right;
  max-width: 60%;
}

/* Expandable Tree */
.tree-section { margin-bottom: 56px; }
.tree-root { margin-left: 0; }
.tree-node { margin-left: 24px; border-left: 1px solid var(--border-subtle); }
.tree-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0 6px 16px;
  cursor: pointer;
  transition: background 0.2s;
  position: relative;
}
.tree-item:hover { background: rgba(57,197,230,0.02); }
.tree-item::before {
  content: '';
  position: absolute;
  left: 0;
  top: 50%;
  width: 8px;
  height: 1px;
  background: var(--border-subtle);
}
.tree-toggle {
  width: 18px; height: 18px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono);
  font-size: 0.6rem;
  color: var(--text-dim);
  border: 1px solid var(--border-subtle);
  border-radius: 3px;
  flex-shrink: 0;
  transition: all 0.2s;
}
.tree-toggle:hover { color: var(--cyan); border-color: var(--cyan); }
.tree-toggle.open { transform: rotate(90deg); }
.tree-label {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--text-primary);
}
.tree-type {
  font-size: 0.6rem;
  color: var(--text-dim);
  padding: 1px 6px;
  border: 1px solid var(--border-subtle);
  border-radius: 2px;
  font-family: var(--font-mono);
}
.tree-children { display: none; }
.tree-children.open { display: block; }

/* Footer */
.footer {
  text-align: center;
  padding: 32px 0 48px;
  border-top: 1px solid var(--border-subtle);
  font-family: var(--font-mono);
  font-size: 0.65rem;
  color: var(--text-dim);
}

/* Tooltip */
.tooltip {
  display: none;
  position: fixed;
  z-index: 100;
  background: var(--bg-card);
  border: 1px solid var(--border-glow);
  border-radius: 4px;
  padding: 12px 16px;
  font-size: 0.7rem;
  color: var(--text-primary);
  max-width: 280px;
  pointer-events: none;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}
.tooltip.visible { display: block; }
.tooltip .tt-title {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  color: var(--cyan);
  margin-bottom: 4px;
}
.tooltip .tt-body { color: var(--text-secondary); line-height: 1.5; }

/* Pulse animation for pipeline nodes */
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(57,197,230,0.2); }
  50% { box-shadow: 0 0 0 6px rgba(57,197,230,0); }
}
.node-pipeline { animation: pulse 3s infinite; }

/* Responsive */
@media (max-width: 900px) {
  .arch-diagram { grid-template-columns: 1fr; }
  .arch-zone { grid-column: 1 !important; grid-row: auto !important; }
  .levels-row { grid-template-columns: repeat(2, 1fr); }
  .levels-arrows { display: none; }
}
</style>
</head>

<div class="container">

<header class="header">

<!-- Architecture Diagram -->
<div class="section-title">Architecture Overview</div>

// Render tree
(function() {
  const root = document.getElementById('treeSection');

  function buildTree(node) {
    const div = document.createElement('div');
    div.className = 'tree-node';

    const item = document.createElement('div');
    item.className = 'tree-item';

    const hasChildren = node.children && node.children.length > 0;
    if (hasChildren) {
      const toggle = document.createElement('span');
      toggle.className = 'tree-toggle';
      toggle.textContent = '▶';
      item.appendChild(toggle);
    } else {
      const spacer = document.createElement('span');
      spacer.style.cssText = 'width:18px;flex-shrink:0';
      item.appendChild(spacer);
    }

    const label = document.createElement('span');
    label.className = 'tree-label';
    label.textContent = node.label;
    item.appendChild(label);

    if (node.type) {
      const type = document.createElement('span');
      type.className = 'tree-type';
      type.textContent = node.type;
      item.appendChild(type);
    }

    div.appendChild(item);

    if (hasChildren) {
      const children = document.createElement('div');
      children.className = 'tree-children';
      node.children.forEach(child => children.appendChild(buildTree(child)));
      div.appendChild(children);

      item.addEventListener('click', function(e) {
        e.stopPropagation();
        const isOpen = children.classList.toggle('open');
        item.querySelector('.tree-toggle').classList.toggle('open', isOpen);
        item.querySelector('.tree-toggle').textContent = isOpen ? '▼' : '▶';
      });
    }

    return div;
  }

  root.appendChild(buildTree(DATA.tree));
})();
